<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engagement investment</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --stable:#21245C; --fresh:#00ADED; --energetic:#0045C2; --passionate:#E34554;
  --limitless:#FAB040;
  --gray:#EDEDED; --white:#FFFFFF; --line:#D7D9E0; --body:#2B2D42; --muted:#5A5D77;
  --font:'Poppins',Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--gray);font-family:var(--font);color:var(--body);
  -webkit-font-smoothing:antialiased;}
.wrap{max-width:780px;margin:0 auto;padding:36px 20px 90px;}

h1{font-size:19px;font-weight:500;color:var(--stable);margin:0 0 30px;letter-spacing:-0.01em;}

.card{background:var(--white);border-radius:12px;padding:26px 26px 28px;margin-bottom:18px;}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--fresh);margin:0 0 3px;}
.sect{font-size:16px;font-weight:500;color:var(--stable);margin:0 0 22px;}

label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:400;}
input[type=number]{width:100%;font-family:var(--font);font-size:16px;
  color:var(--stable);background:var(--white);border:1px solid var(--line);
  border-radius:8px;padding:13px 14px;outline:none;transition:border-color 180ms;}
input:focus{border-color:var(--fresh);}
input[type=number]{-moz-appearance:textfield;}
.field{margin-bottom:20px;}
.field:last-child{margin-bottom:0;}

.money{position:relative;}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:16px;color:var(--muted);pointer-events:none;}
.money input{padding-left:30px;}

/* step buttons */
.next{display:block;width:100%;margin-top:26px;border:none;cursor:pointer;
  font-family:var(--font);font-size:17px;font-weight:500;color:#fff;
  padding:22px 24px;border-radius:12px;
  background:radial-gradient(circle at 26% 16%, #00ADED 0%, #21245C 78%);
  box-shadow:0 12px 28px rgba(33,36,92,0.22);transition:opacity 180ms;}
.next:hover{opacity:0.92;}
.back{display:inline-block;margin-top:6px;background:none;border:none;cursor:pointer;
  font-family:var(--font);font-size:14px;font-weight:400;color:var(--muted);padding:10px 0;}
.back:hover{color:var(--stable);}

/* headline price */
.head{background:radial-gradient(circle at 26% 16%, #00ADED 0%, #21245C 78%);
  color:#fff;border-radius:12px;padding:32px 26px;margin-bottom:18px;
  box-shadow:0 14px 34px rgba(33,36,92,0.22);}
.head .eyebrow{color:rgba(255,255,255,0.72);}
.price{font-size:52px;font-weight:600;letter-spacing:-0.025em;line-height:1.05;margin:8px 0 0;}
.perline{font-size:14px;color:rgba(255,255,255,0.82);margin-top:12px;line-height:1.7;}

/* rows */
.row{display:flex;align-items:baseline;gap:12px;padding:11px 0;font-size:14px;}
.row .lbl{flex:1;color:var(--body);}
.row .sub{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
.row .amt{font-weight:500;color:var(--stable);white-space:nowrap;font-variant-numeric:tabular-nums;}

/* included list */
.incl{margin:0;padding:0;list-style:none;}
.incl li{position:relative;padding:0 0 12px 22px;font-size:14px;line-height:1.55;}
.incl li:last-child{padding-bottom:0;}
.incl li::before{content:'';position:absolute;left:2px;top:8px;width:7px;height:7px;
  border-radius:50%;background:var(--fresh);}

.view{display:none;}
.view.on{display:block;}

@media print{
  body{background:#fff;}
  .wrap{max-width:none;padding:0;}
  .card,.head{box-shadow:none;page-break-inside:avoid;}
  .next,.back{display:none;}
  input{border:none;padding:0;font-size:14px;}
  .money input{padding-left:0;}
}
</style>
</head>
<body>
<div class="wrap">

<h1 id="pageTitle">Engagement investment</h1>

<!-- ============ STEP 1 — business case ============ -->
<section class="view" id="viewCase">
  <div class="card">
    <p class="eyebrow">Business case</p>
    <h2 class="sect">Five questions about your numbers</h2>

    <div class="field">
      <label for="revenue">Annual revenue</label>
      <div class="money"><span>$</span><input type="number" id="revenue" min="0" step="1000" placeholder="0"></div>
    </div>
    <div class="field">
      <label for="gpMarginPct">Gross profit margin, as a percentage</label>
      <input type="number" id="gpMarginPct" min="0" step="1" placeholder="0">
    </div>
    <div class="field">
      <label for="problemImpact">What the problems you want solved are costing you each year</label>
      <div class="money"><span>$</span><input type="number" id="problemImpact" min="0" step="1000" placeholder="0"></div>
    </div>
    <div class="field">
      <label for="clientLtv">Lifetime value of an average new client</label>
      <div class="money"><span>$</span><input type="number" id="clientLtv" min="0" step="1000" placeholder="0"></div>
    </div>
    <div class="field">
      <label for="salesCycleMonths">Length of an average sales cycle, in months</label>
      <input type="number" id="salesCycleMonths" min="0" step="1" placeholder="0">
    </div>

    <button class="next" id="btnNext">Next</button>
  </div>
</section>

<!-- ============ STEP 2 — investment ============ -->
<section class="view" id="viewPrice">

  <div class="head">
    <p class="eyebrow">Annual investment</p>
    <p class="price" id="outPrice">$0</p>
    <p class="perline" id="outPer"></p>
  </div>

  <div class="card">
    <p class="eyebrow">The engagement</p>
    <h2 class="sect">What we deliver across the year</h2>

    <div class="field">
      <label for="learners">People being trained</label>
      <input type="number" id="learners" min="0" step="1">
    </div>
    <div class="field">
      <label for="teamSessions">Team training sessions</label>
      <input type="number" id="teamSessions" min="0" step="1">
    </div>
    <div class="field">
      <label for="leaderSessions">Leadership training sessions</label>
      <input type="number" id="leaderSessions" min="0" step="1">
    </div>
    <div class="field">
      <label for="coachingSessions">One-on-one leadership coaching sessions</label>
      <input type="number" id="coachingSessions" min="0" step="1">
    </div>
  </div>

  <div class="card">
    <p class="eyebrow">Included</p>
    <h2 class="sect">What the investment covers</h2>
    <ul class="incl" id="outIncl"></ul>
  </div>

  <div class="card" id="cardEcon">
    <p class="eyebrow">In your terms</p>
    <h2 class="sect">What the investment looks like next to your numbers</h2>
    <div id="rowsEcon"></div>
  </div>

  <button class="back" id="btnBack">Back to your numbers</button>
</section>

</div>

<script>
(function(){

  /* ---------------------------------------------------------------
     Set up an engagement here, or override any of it in the link:
     index.html?client=Acme&learners=8&team=24&leader=0&coaching=24
  --------------------------------------------------------------- */
  var CONFIG = {
    client:           '',   // company name shown in the page title
    learners:          5,
    teamSessions:     24,
    aorTeamSessions:   0,   // subset of team sessions led by the Associate of Record
    leaderSessions:    0,
    coachingSessions: 24,
    aorYears:          5,   // Associate of Record experience
    trainerYears:      1    // trainer experience
  };

  var RATES = {
    exp1:      500,   // hourly, years 1-2
    exp2:     1000,   // hourly, years 3-5
    exp3:     1500,   // hourly, years 6+
    learner1:  184,   // per learner, per session, 1-9 learners
    learner10: 100,   // per learner, per session, 10+ learners
    materials: 500,   // per learner, practice licenses and materials
    onlinePct:   5    // percent of subtotal, online platform
  };

  // ---- query-string overrides ----
  var q = {};
  location.search.replace(/^\?/,'').split('&').forEach(function(pair){
    if (!pair) return;
    var kv = pair.split('=');
    q[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g,' '));
  });
  var map = { client:'client', learners:'learners', team:'teamSessions',
    aorTeam:'aorTeamSessions', leader:'leaderSessions', coaching:'coachingSessions',
    aorYears:'aorYears', trainerYears:'trainerYears' };
  Object.keys(map).forEach(function(k){
    if (q[k] === undefined || q[k] === '') return;
    CONFIG[map[k]] = (k === 'client') ? q[k] : parseFloat(q[k]);
  });

  function el(id){ return document.getElementById(id); }
  function n(id){ var v = parseFloat(el(id).value); return isFinite(v) ? v : 0; }
  function usd(v){ return '$' + Math.round(v).toLocaleString('en-US'); }
  function dec(v,p){ return (isFinite(v) ? v : 0).toFixed(p); }
  function plural(c,word){ return c + ' ' + word + (c === 1 ? '' : 's'); }
  function people(c){ return c === 1 ? '1 person' : c + ' people'; }

  function expRate(years){
    if (years >= 6) return RATES.exp3;
    if (years >= 3) return RATES.exp2;
    return RATES.exp1;
  }
  function learnerRate(learners){
    return learners >= 10 ? RATES.learner10 : RATES.learner1;
  }
  function row(label, sub, amt){
    return '<div class="row">' +
      '<div class="lbl">' + label + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</div>' +
      '<div class="amt">' + amt + '</div></div>';
  }

  // ---- apply config ----
  if (CONFIG.client) {
    el('pageTitle').textContent = CONFIG.client + ' \u2014 engagement investment';
    document.title = CONFIG.client + ' \u2014 engagement investment';
  }
  el('learners').value         = CONFIG.learners;
  el('teamSessions').value     = CONFIG.teamSessions;
  el('leaderSessions').value   = CONFIG.leaderSessions;
  el('coachingSessions').value = CONFIG.coachingSessions;

  function calc(){
    var learners = n('learners');
    var team     = n('teamSessions');
    var leader   = n('leaderSessions');
    var coaching = n('coachingSessions');

    var aorTeam = Math.min(CONFIG.aorTeamSessions, team);
    var trnTeam = Math.max(team - aorTeam, 0);
    var aorRate = expRate(CONFIG.aorYears);
    var trnRate = expRate(CONFIG.trainerYears);

    var learnerSessions = team + leader;

    var byHour = (leader * aorRate) + (coaching * aorRate) +
                 (aorTeam * aorRate) + (trnTeam * trnRate);
    var byLearner = learners * learnerSessions * learnerRate(learners);

    var base      = Math.max(byHour, byLearner);
    var materials = learners * RATES.materials;
    var subtotal  = base + materials;
    var total     = subtotal + subtotal * (RATES.onlinePct / 100);

    // ---- headline ----
    el('outPrice').textContent = usd(total);
    var per = [usd(total / 12) + ' / month'];
    if (learners > 0 && learnerSessions > 0){
      per.push(usd(total / (learners * learnerSessions)) + ' per person, per session');
    }
    el('outPer').textContent = per.join('\u2003\u00b7\u2003');

    // ---- what's included ----
    var inc = [];
    if (team > 0)     inc.push(plural(team, 'team training session') + ' for ' + people(learners));
    if (leader > 0)   inc.push(plural(leader, 'leadership training session'));
    if (coaching > 0) inc.push(plural(coaching, 'one-on-one leadership coaching session'));
    inc.push('Online platform access for every person on the team');
    inc.push('Practice licenses and course materials for every person on the team');
    el('outIncl').innerHTML = inc.map(function(x){ return '<li>' + x + '</li>'; }).join('');

    // ---- in your terms ----
    var rev    = n('revenue');
    var gpPct  = n('gpMarginPct');
    var gp     = rev * (gpPct / 100);
    var impact = n('problemImpact');
    var ltv    = n('clientLtv');
    var cycle  = n('salesCycleMonths');

    var pctRev      = rev > 0 ? (total / rev) * 100 : 0;
    var pctGp       = gp  > 0 ? (total / gp)  * 100 : 0;
    var roi         = total > 0 ? impact / total : 0;
    var gpPerClient = ltv * (gpPct / 100);
    var clients     = gpPerClient > 0 ? total / gpPerClient : 0;
    var payback     = clients * cycle;

    var hasEcon = rev > 0 || impact > 0 || ltv > 0;
    el('cardEcon').style.display = hasEcon ? 'block' : 'none';

    if (hasEcon){
      var e = '';
      if (rev > 0)    e += row('Share of your annual revenue', '', dec(pctRev,2) + '%');
      if (gp > 0)     e += row('Share of your annual gross profit', usd(gp) + ' gross profit', dec(pctGp,2) + '%');
      if (impact > 0) e += row('Return against what the problems cost you',
                          'Against ' + usd(impact) + ' a year', dec(roi,1) + 'x');
      if (ltv > 0)    e += row('New clients that cover the investment',
                          usd(gpPerClient) + ' gross profit per client', dec(clients,1));
      if (ltv > 0 && cycle > 0) e += row('Time to pay it back',
                          'At one new client per sales cycle', dec(payback,1) + ' months');
      el('rowsEcon').innerHTML = e;
    }
  }

  // ---- steps ----
  function show(hash){
    var price = (hash === '#investment');
    el('viewCase').className  = 'view' + (price ? '' : ' on');
    el('viewPrice').className = 'view' + (price ? ' on' : '');
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', function(){ show(location.hash); });
  el('btnNext').addEventListener('click', function(){ location.hash = '#investment'; });
  el('btnBack').addEventListener('click', function(){ location.hash = '#your-numbers'; });

  ['revenue','gpMarginPct','problemImpact','clientLtv','salesCycleMonths',
   'learners','teamSessions','leaderSessions','coachingSessions'].forEach(function(id){
    el(id).addEventListener('input', calc);
  });

  show(location.hash);
  calc();
})();
</script>
</body>
</html>
